#:schema node_modules/wrangler/config-schema.json
# known.life — LOCAL DEV ONLY.
#
# This file does NOT deploy anything and is not read by any deploy path. The
# production deploy goes through the cloudflare adapter's Workers REST upload,
# driven entirely by this unit's `.life` head — which is the sole source for the
# worker name, the custom domain, the assets, the resource names and binding
# vars, the D1 schema apply, the secrets and the observability config.
#
# Its ONE reader is `platformProxy: { enabled: true }` in astro.config.mjs: the
# bindings below are what makes `astro dev` serve a homepage that can read D1.
# So keep it to bindings the local runtime needs, and nothing the head declares —
# a fuller copy here is a twin that drifts silently, which is what this file was
# (it carried `main`, `[assets]`, a `[[routes]]` custom domain and two never-filled
# `TODO_FILL_IN_FROM_wrangler_*` ids, while never once being read).
#
# Local bindings are simulated by miniflare against `.wrangler/state`, so the
# ids below are placeholders the config schema requires, never dialled. They are
# deliberately NOT the live resource ids: nothing verifies a value here, so a real
# one would be a fact going stale in a file no deploy reads.

name = "known-life"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

# D1 — accounts, names, packages, versions, embeddings (the registry gene's
# schema.sql; the adapter applies it on every deploy).
[[d1_databases]]
binding = "DB"
database_name = "known-life-db"
database_id = "local"

# KV — auth sessions, rankings cache, rate limits. Read as env.KNOWN_KV.
[[kv_namespaces]]
binding = "KNOWN_KV"
id = "local"

# R2 — content-addressed package blobs.
[[r2_buckets]]
binding = "KNOWN_R2"
bucket_name = "known-life-known-r2"

# env.AI (Workers AI, the /search embeddings) is deliberately absent: it has no
# local simulation, so dev exercises the cached-embedding path. The binding is
# real in production, declared as `infra.ai:` in the head like every other one.
